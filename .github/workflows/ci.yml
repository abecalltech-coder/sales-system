name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sales_system_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sales_system_test?schema=public
      JWT_ACCESS_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Prisma generate
        run: pnpm exec prisma generate --schema prisma/schema.prisma

      - name: Prisma migrate deploy
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Lint (api)
        run: pnpm --filter @sales-system/api lint

      - name: Typecheck & build (api)
        run: pnpm --filter @sales-system/api build

      - name: Typecheck & build (web)
        run: pnpm --filter @sales-system/web build

      - name: Unit tests (api)
        run: pnpm --filter @sales-system/api test -- --ci
